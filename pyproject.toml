[project]
name = "agentic-orchestration"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vikash", email = "vktofly@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "chromadb>=1.5.9",
    "dspy-ai>=3.3.0",
    "fastapi>=0.141.1",
    "fastembed>=0.8.0",
    "google-generativeai>=0.8.6",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "onnxruntime>=1.29.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
agentic-orchestration = "agentic_orchestration:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
